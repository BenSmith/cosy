name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: dnf install -y ShellCheck

      - name: Run ShellCheck
        run: |
          shellcheck cosy

      - name: Run ShellCheck (strict mode)
        run: |
          shellcheck --severity=style cosy

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: dnf install -y bats

      - name: Run unit tests
        run: |
          bats test/unit/

  integration-tests:
    name: Integration Tests (Fedora ${{ matrix.fedora-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora-version: [43, 42]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Fedora container for testing
        run: |
          # Pull Fedora image
          podman pull fedora:${{ matrix.fedora-version }}

      - name: Install bats on host
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Diagnose sudo failure (temporary)
        run: |
          set -x
          podman --version
          podman info --format '{{.Host.Security.Rootless}} storage={{.Store.GraphDriverName}}' || true
          ./cosy create --sudo diag-test || true
          U=$(podman exec diag-test printenv COSY_CONTAINER_USER || true)
          echo "user=$U"
          podman exec diag-test getent passwd 1001 || true
          podman exec diag-test sh -c "grep '^$U:' /etc/shadow || echo NO_SHADOW_ENTRY" || true
          podman exec diag-test ls -la /etc/sudoers.d/ || true
          podman exec diag-test cat /etc/sudoers.d/cosy-user || true
          podman exec diag-test ls -la /usr/bin/sudo || true
          podman exec --user "$U" diag-test id || true
          podman exec --user "$U" diag-test sudo -n whoami; echo "sudo_exit=$?"
          ./cosy rm --home diag-test || true
        env:
          COSY_TEST_SKIP_HARDWARE: "true"

      - name: Run integration tests
        run: |
          bats -j 4 --print-output-on-failure test/integration/
        env:
          # Skip tests that require actual hardware
          COSY_TEST_SKIP_HARDWARE: "true"

  seccomp-tests:
    name: Seccomp Profile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run seccomp profile tests
        run: |
          bats test/integration/seccomp.bats

  all-tests:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [shellcheck, unit-tests, integration-tests, seccomp-tests]
    steps:
      - name: Success
        run: echo "All tests passed!"
